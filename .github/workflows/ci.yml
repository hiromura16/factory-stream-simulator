name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --python "${{ matrix.python }}"
      - run: uv run --frozen python --version
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python -m compileall -q app.py factorylib.py producer.py scripts
      - run: node --check static/app.js
      - run: node --test tests/*.test.cjs
      - if: matrix.python == '3.14'
        run: |
          uv run --frozen --with markdown-it-py==4.0.0 python scripts/build_help.py --check
          uv run --frozen python scripts/check_shared.py
      - if: matrix.python == '3.12'
        run: docker build -t factory-source:test .
