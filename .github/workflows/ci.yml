name: Validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: python -m compileall -q app.py factorylib.py producer.py scripts
      - run: node --check static/app.js
      - run: docker build -t factory-source:test .
