[project]
name = 'factory-stream-simulator'
version = "0.2.0"
description = "Independent manufacturing factory data producer"
requires-python = ">=3.12,<3.14"
dependencies = [
    'fastapi==0.121.2',
    'uvicorn==0.38.0',
    'paho-mqtt==2.2.0',
    "cryptography>=46,<50",
    "confluent-kafka>=2.12,<3",
    "pika>=1.3,<2",
    "nats-py[nkeys]>=2.11,<3",
    "websockets>=15,<17",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
